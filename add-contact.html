<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Add Contact</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Gabarito:wght@600;700;800&display=swap" rel="stylesheet">
        <link href="styles.css" rel="stylesheet">
    </head>
    <body>
        <div class="book">
            <main class="page page-plain">
                <a class="back-link" id="homeLink" href="index.html"><i class="bi bi-arrow-left" aria-hidden="true"></i> All contacts</a>
                <h1 class="page-title">New contact</h1>

                <form id="editForm" class="fields">
                    <div class="field">
                        <label for="firstname">First name</label>
                        <input type="text" class="form-control" name="firstname" id="firstname" autocomplete="given-name" required/>
                    </div>
                    <div class="field">
                        <label for="lastname">Last name</label>
                        <input type="text" class="form-control" name="lastname" id="lastname" autocomplete="family-name"/>
                    </div>
                    <div class="field">
                        <label for="mobile">Mobile</label>
                        <input type="tel" class="form-control" name="mobile" id="mobile" autocomplete="tel"/>
                    </div>
                    <div class="field">
                        <label for="email">Email</label>
                        <input type="email" class="form-control" name="email" id="email" autocomplete="email"/>
                    </div>
                    <div class="field">
                        <label for="avatar">Photo</label>
                        <div class="avatar-picker">
                            <div id="avatarPreview" data-size="avatar-medium">
                                <span class="avatar avatar-medium"><i class="bi bi-person-fill" aria-hidden="true"></i></span>
                            </div>
                            <input type="file" class="form-control" name="avatar" id="avatar" accept="image/*"/>
                        </div>
                    </div>
                    <p class="form-error" id="formError" role="alert" hidden></p>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-tab" id="SubmitForm">Add contact</button>
                    </div>
                </form>
            </main>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="./config.js"></script>
        <script src="./ui.js"></script>
        <script>
            document.getElementById("SubmitForm").addEventListener('click', submitForm);
            document.getElementById("avatar").addEventListener('change', function(){
                previewAvatar(this, "avatarPreview");
            });

            function submitForm(e){
                e.preventDefault();

                const formElement = document.querySelector('#editForm');
                if(!formElement.reportValidity()){
                    return;
                }

                const form = new FormData(formElement);
                form.append('apiKey', apiKey);

                fetch(rootPath + 'controller/insert-contact/', {
                    method: 'POST',
                    headers: {'Accept': 'application/json, *.*'},
                    body: form
                })
                .then(function(response){
                    return response.text();
                })
                .then(function(data){
                    if(data == "1"){
                        setFlash("Contact added.");
                        homeLink();
                    }else{
                        showError(data);
                    }
                })
                .catch(function(){
                    showError("The contact wasn't added. Check your internet connection, then try again.");
                });
            }

            function showError(message){
                var error = document.getElementById("formError");
                error.textContent = message;
                error.hidden = false;
            }

            function homeLink(){
                window.open("index.html", "_self");
            }
        </script>
    </body>
</html>
